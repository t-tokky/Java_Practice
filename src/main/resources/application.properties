# このファイルはSpring Bootアプリの起動時の設定を記述するファイル

# アプリの名前 ログや監視ツールが使うらしい
spring.application.name=qiita-summary-notifier

# PostgreSQLのドライバ
spring.datasource.driver-class-name=org.postgresql.Driver

# ログの出力レベルをDEBUGにする
logging.level.com.portfolio.qiita_summary_notifier=DEBUG

# アプリ起動時にDBが初期化される
# よくわかってない
spring.sql.init.mode=always

# コンソール出力時の文字コードをUTF-8に指定
logging.charset.console=UTF-8

# 実行環境はこのファイルの設定だけ読み込まれる
# 開発環境はlaunch.jsonで環境変数を利用してlocalの設定で上書きできる
# DBの接続情報
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# QiitaAPIのAPIKey
qiita.api.token=${QIITA_API_TOKEN}

# Geminiのトークン 要約するための自分個人のもの
gemini.api.token=${GEMINI_API_TOKEN}

# ポート指定 環境変数PORTがあればそれを使い、なければ8080(デフォルト)
server.port=${PORT:8080}

# DBとJavaの名前問題を自動で解決してくれるオプション
# created_at(DB)とcreatedAt(Java)を自動で変換してくれるやつらしい
mybatis.configuration.map-underscore-to-camel-case=true