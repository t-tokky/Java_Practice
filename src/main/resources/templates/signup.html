<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
</head>
<body>
    <h1>新規登録</h1>

    <div class="signup">
        <p th:if="${message}" th:text="${message}">登録失敗時のメッセージ欄</p>

        <form th:action="@{/signup}" method="post" th:object="${registerForm}">

            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red;"></p>
            
            <label for="username">ユーザーネーム</label>
            <input type="text" name="username"><br>

            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></p>

            <label for="password">パスワード</label>
            <input type="password" name="password"><br>

            <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" style="color: red;"></p>

            <label for="passwordConfirm">確認用パスワード</label>
            <input type="password" name="passwordConfirm"><br>

            <button type="submit">登録する</button>

        </form>

        <a th:href="@{/}">ホームへ戻る</a>
        <a th:href="@{/login}">登録済みのユーザーはこちら</a>
    </div>
</body>
</html>
