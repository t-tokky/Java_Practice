<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>ログインフォーム</title>
</head>
<body>

<main>
    <h1>ログイン画面</h1>
    <div class="login">
        <div th:if="${param.error}">
            <p style="color: red;">ユーザーネームまたはパスワードが違います</p>
        </div>
        <div th:if="${param.logout}">
            <p style="color: blue">ログアウトしました</p>
        </div>
        <div th:if="${param.deleted != null}">
            <p style="color: blue">退会処理が完了しました</p>
        </div>

        <p th:text="${message}">ユーザー登録後のメッセージ欄</p>

        <form th:action="@{/login}" method="post">

            <label for="username">ユーザーネーム</label>
            <input type="text" name="username"><br>

            <label for="password">パスワード</label>
            <input type="password" name="password"><br>

            <button type="submit">ログイン</button>

        </form>

        <a th:href="@{/}">ホームへ戻る</a>
        <a th:href="@{/signup}">新規登録はこちら</a>
    </div>
</main>
</body>
</html>
