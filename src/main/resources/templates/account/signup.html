<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>新規登録</title>
</head>
<body>

<main class="container">
    <h1>新規登録</h1>

    <div class="signup-container">
        <p th:if="${message}" th:text="${message}" class="alert-danger">登録失敗時のメッセージ欄</p>

        <form th:action="@{/signup}" method="post" th:object="${registerForm}" class="auth-form">
            
            <div class="form-group">
                <label for="username">ユーザーネーム</label>
                <input type="text" name="username" id="username">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-text"></p>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" name="password" id="password">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></p>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">確認用パスワード</label>
                <input type="password" name="passwordConfirm" id="passwordConfirm">
                <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="error-text"></p>
            </div>

            <button type="submit" class="btn btn-primary">登録する</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/}">ホームへ戻る</a>
            <a th:href="@{/login}">登録済みのユーザーはこちら</a>
        </div>
    </div>
</main>

</body>
</html>
