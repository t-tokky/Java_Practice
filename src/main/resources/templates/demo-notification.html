<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お試し通知機能</title>
</head>
<body>
    <h2>デモボタン画面</h2>
    
    <section class="overview">
        <h3>概要</h3>
        <p>Qiitaの記事をタグ検索で取得して、そのリンクや紹介文をDiscordに送ることができます</p>
    </section>

    <section class="how-to">
        <h3>使い方</h3>
        <!-- このセクションに画像を追加
            <img th:src="@{images/ファイル名}" alt="説明">でおいておけばいい
            画像などはresources/static/images/に入れておく    
            qiita公式へのリンクも欲しい
        -->
        <ol>
            <li>検索タグ・除外タグにQiitaのタグを「,」(カンマ)区切りで入力</li>
            <li>DiscordのテキストチャンネルからWebhook URLを取得して入力</li>
            <li>通知ボタンを押してDiscordのテキストチャンネルを確認</li>
        </ol>

        <div class="guide-tabs">
            <h4>WebhookURLの取得方法</h4> 
            <div id="frame"></div>
            <button type="button" id="prevBtn" class="change">前へ</button>
            <button type="button" id="nextBtn" class="change">次へ</button><br>
            <button type="button" class="pc tab-Btn">PC</button>
            <button type="button" class="phone tab-Btn">スマホ</button>
        </div>
    </section>
    
    <!-- 縦に並べるために、1項目ずつ div で囲みます -->
    <div class="setting">
        <h3>入力フォーム</h3>
        <div>
            <label for="include">検索タグ：</label>
            <input type="text" id="include" placeholder="例: Java, Spring Boot">
        </div>
        
        <div>
            <label for="exclude">除外タグ：</label>
            <input type="text" id="exclude" placeholder="例: AI, ポエム">
        </div>
        
        <div>
            <label for="webhookUrl">Webhook URL：</label>
            <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
        </div>
    </div>
    
    <button type="button" id="demoBtn">通知する</button>
    <p id="result"></p>  <!-- ボタンを押した後のメッセージ欄 -->

    <script th:src="@{/js/guide.js}"></script>
    <script th:src="@{/js/demo.js}"></script>
</body>
</html>
