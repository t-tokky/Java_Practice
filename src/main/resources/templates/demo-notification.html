<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>デモ機能</title>
</head>
<body>

<main>
    <h2>デモ機能を試す</h2>
    
    <section class="overview">
        <h3>概要</h3>
        <p class="description">
            このページでは実際に届く通知内容の体験ができます。
        </p>

        <div class="overview-links">
            <a href="https://qiita.com" target="_blank" rel="noopener noreferrer" class="qiita-link">
                Qiita公式サイト ↗
            </a>
            <a href="https://qiita.com/tags" target="_blank" rel="noopener noreferrer" class="qiita-link">
                Qiitaタグ一覧 ↗
            </a>
        </div>
    </section>

    <section class="how-to">
        <h3>使い方</h3>
        <ol>
            <li>検索タグ・除外タグにQiitaのタグを「,」(カンマ)区切りで入力</li>
            <li>DiscordのテキストチャンネルからWebhook URLを取得して入力</li>
            <li>通知ボタンを押してDiscordのテキストチャンネルを確認</li>
        </ol>

        <div class="guide-tabs">
            <h4>WebhookURLの取得方法</h4> 
            <div id="frame"></div>
            <button type="button" id="prevBtn" class="change">前へ</button>
            <button type="button" id="nextBtn" class="change">次へ</button><br>
            <button type="button" class="pc tab-Btn">PC</button>
            <button type="button" class="phone tab-Btn">スマホ</button>
        </div>
    </section>
    
    <div class="setting">
        <h3>入力フォーム</h3>
        <div>
            <label for="include">検索タグ：</label>
            <input type="text" id="include" placeholder="例: Java, Spring Boot">
        </div>
        
        <div>
            <label for="exclude">除外タグ：</label>
            <input type="text" id="exclude" placeholder="例: AI, ポエム">
        </div>
        
        <div>
            <label for="webhookUrl">Webhook URL：</label>
            <input type="password" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
        </div>
    </div>
    
    <button type="button" id="demoBtn">通知する</button>
    <p id="result"></p>  <!-- ボタンを押した後のメッセージ欄 -->

    <script src="../static/js/guide.js" th:src="@{/js/guide.js}"></script>
    <script src="../static/js/demo.js" th:src="@{/js/demo.js}"></script>
</main>

</body>
</html>
