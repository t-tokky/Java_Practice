<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>マイページ</title>
</head>
<body>

<main>
    <h1>マイページ</h1>
    <div class="setting-detail" th:object="${setting}">
        <p th:if="${message}" th:text="${message}">フラッシュメッセージがなければpタグ自体が消える</p>
        <h2>現在の設定</h2>
        <p>検索タグ<span th:text="*{includeTags}"></span></p>
        <p>除外タグ<span th:text="*{excludeTags}"></span></p>
        <p>Webhookの名前<span th:text="*{webhookName}"></span></p>
        <p>
            通知の切り替え
            <span th:if="*{isActive}">通知あり</span>
            <span th:if="!*{isActive}">通知なし</span>
        </p>
        <a th:href="@{/settings/form}">設定変更</a>
    </div>

    <div class="logout">
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </div>

    <div class="delete-account">
        <a th:href="@{/user/delete/confirm}">ユーザー情報を削除する</a>
    </div>
</main>

</body>
</html>
