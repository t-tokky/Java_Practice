<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>マイページ</title>
</head>
<body>

<main class="container">
    <h1>マイページ</h1>
    
    <div class="setting-detail" th:object="${setting}">
        <p th:if="${message}" th:text="${message}" class="alert-success">フラッシュメッセージ</p>
        
        <h2>現在の設定</h2>
        
        <!-- 文字の詰まりを解消するため、pタグの羅列から tableタグ（表）に変更 -->
        <table class="settings-table">
            <tbody>
                <tr>
                    <th>検索タグ</th>
                    <td th:text="*{includeTags}"></td>
                </tr>
                <tr>
                    <th>除外タグ</th>
                    <td th:text="*{excludeTags}"></td>
                </tr>
                <tr>
                    <th>Webhookの名前</th>
                    <td th:text="*{webhookName}"></td>
                </tr>
                <tr>
                    <th>通知の切り替え</th>
                    <td>
                        <span th:if="*{isActive}">通知あり</span>
                        <span th:if="!*{isActive}">通知なし</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- ボタンをグループ化してCSSを当てやすくする -->
        <div class="action-buttons">
            <a th:href="@{/settings/form}" class="btn btn-primary">設定変更</a>
        </div>
    </div>

    <!-- 危険な操作（ログアウト・退会）は少し離したエリアにまとめる -->
    <div class="danger-zone">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline">ログアウト</button>
        </form>
        <div class="delete-account">
            <a th:href="@{/user/delete/confirm}" class="text-danger">ユーザー情報を削除する</a>
        </div>
    </div>
</main>

</body>
</html>
