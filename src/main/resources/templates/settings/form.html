<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>設定の変更</title>
</head>
<body>

<main>
    <h1 th:if="${setting.id == null}">設定の新規登録</h1>
    <h1 th:if="${setting.id != null}">設定の編集</h1>

    <form th:action="@{/settings/save}" th:object="${setting}" method="post">
        <input type="hidden" th:field="*{id}">

        <div>
            <label for="includeTags">検索タグ</label>
            <input type="text" th:field="*{includeTags}"><br>

            <p th:if="${#fields.hasErrors('includeTags')}" th:errors="*{includeTags}" style="color: red;">
                エラーメッセージの表示
            </p>
        </div>
        
        <div>
            <label for="excludeTags">除外タグ</label>
            <input type="text" th:field="*{excludeTags}"><br>
        </div>

        <div>
            <label for="webhookName">Webhookの名前</label>
            <input type="text" th:field="*{webhookName}"><br>

            <p th:if="${#fields.hasErrors('webhookName')}" th:errors="*{webhookName}" style="color: red;">
                エラーメッセージの表示
            </p>
        </div>

        <div>
            <label for="webhookUrl">Webhook URL</label>
            <input type="password" id="webhookUrl" name="webhookUrl" placeholder="https://discord.com/api/webhooks/..."><br>

            <p th:if="${#fields.hasErrors('webhookUrl')}" th:errors="*{webhookUrl}" style="color: red;">
                エラーメッセージの表示
            </p>
        </div>

        <div>
            <label for="isActive">通知の切り替え</label>
            <input type="checkbox" th:field="*{isActive}"><br>
        </div>

        <a th:href="@{/settings/detail}">戻る</a>

        <button type="submit" th:text="${setting.id == null} ? '登録' : '更新'">
            送信ボタン ここは上書きされる
        </button>
    </form>
</main>

</body>
</html>
